name: CD Engine

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target hosting environment (dev, qa, prod)'
        required: true
        type: string
      api_image:
        description: 'Full GHCR container tag for the API'
        required: true
        type: string
      spa_image:
        description: 'Full GHCR container tag for the SPA'
        required: true
        type: string
    secrets:
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      SSH_KEY:
        required: true
      POSTGRES_PASSWORD:
        required: true
      GHCR_PAT:
        required: true
      RESEND_API_KEY:
        required: false
      JWT_PRIVATE_KEY:
        required: false
      JWT_PUBLIC_KEY:
        required: false
      TAILSCALE_AUTHKEY:
        required: true

jobs:
  deploy:
    name: Deploy to server on env ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout infra repository
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/sapcyti-infra

      - name: Set Environment-Specific Routing Variables
        id: env_vars
        run: |
          if [ "${{ inputs.environment }}" = "dev" ]; then
            echo "spring_profile=docker" >> $GITHUB_OUTPUT
            echo "allowed_origin=https://dev.sapcyti.site" >> $GITHUB_OUTPUT
            echo "edge_port=8090" >> $GITHUB_OUTPUT
          elif [ "${{ inputs.environment }}" = "qa" ]; then
            echo "spring_profile=qa" >> $GITHUB_OUTPUT
            echo "allowed_origin=https://qa.sapcyti.site" >> $GITHUB_OUTPUT
            echo "edge_port=9090" >> $GITHUB_OUTPUT
          elif [ "${{ inputs.environment }}" = "prod" ]; then
            echo "spring_profile=prod" >> $GITHUB_OUTPUT
            echo "allowed_origin=https://sapcyti.site" >> $GITHUB_OUTPUT
            echo "edge_port=8080" >> $GITHUB_OUTPUT
          fi

      - name: Conectar runner a Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci

      # appleboy/*-action corre en un contenedor y no ve tailscale0 del runner.
      # scp/ssh nativos salen por la Tailnet. Los secretos van por stdin, no por argv.
      - name: Copy Config Blueprints and Scripts via SCP
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/deploy_key"
          trap 'rm -f "$key_file"' EXIT
          if [[ "$SSH_KEY" == *$'\n'* ]]; then
            printf '%s\n' "$SSH_KEY" > "$key_file"
          else
            printf '%b\n' "$SSH_KEY" > "$key_file"
          fi
          ssh_opts=(-i "$key_file" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new)
          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" "mkdir -p ~/sapcyti/${{ inputs.environment }}"
          scp "${ssh_opts[@]}" \
            production/docker-compose.yml \
            production/env_build.sh \
            "$SSH_USER@$SSH_HOST:~/sapcyti/${{ inputs.environment }}/"

      - name: Execute Remote Deployment via SSH Script
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DB_PASS: ${{ secrets.POSTGRES_PASSWORD }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/deploy_key"
          trap 'rm -f "$key_file"' EXIT
          if [[ "$SSH_KEY" == *$'\n'* ]]; then
            printf '%s\n' "$SSH_KEY" > "$key_file"
          else
            printf '%b\n' "$SSH_KEY" > "$key_file"
          fi
          {
            printf 'export DB_PASS=%q\n' "$DB_PASS"
            printf 'export GHCR_PAT=%q\n' "$GHCR_PAT"
            printf 'export RESEND_API_KEY=%q\n' "$RESEND_API_KEY"
            printf 'export JWT_PRIVATE_KEY=%q\n' "$JWT_PRIVATE_KEY"
            printf 'export JWT_PUBLIC_KEY=%q\n' "$JWT_PUBLIC_KEY"
            cat <<'REMOTE'
          set -euo pipefail
          chmod +x ~/sapcyti/${{ inputs.environment }}/env_build.sh
          ~/sapcyti/${{ inputs.environment }}/env_build.sh \
            "${{ inputs.environment }}" \
            "${{ inputs.api_image }}" \
            "${{ inputs.spa_image }}" \
            "${{ steps.env_vars.outputs.edge_port }}" \
            "$DB_PASS" \
            "$GHCR_PAT" \
            "${{ steps.env_vars.outputs.spring_profile }}" \
            "${{ steps.env_vars.outputs.allowed_origin }}" \
            "$RESEND_API_KEY"
          REMOTE
          } | ssh -i "$key_file" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" bash -s
