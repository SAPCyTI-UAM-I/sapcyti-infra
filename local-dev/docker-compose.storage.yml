# Docker Compose — SAPCyTI Development Object Storage (S3 / RustFS)
# Usage: docker compose -f local-dev/docker-compose.storage.yml up -d

services:
  storage:
    image: ${STORAGE_IMAGE:-rustfs/rustfs:latest}
    container_name: sapcyti-dev-storage
    restart: unless-stopped
    ports:
      # 9000: S3 REST API endpoint (consumed by sapcyti-api)
      - "9000:9000"
      # 9001: Web Console for developer inspection of uploaded documents
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-sapcyti_dev_access}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-sapcyti_dev_secret_key}
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-sapcyti_dev_access}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-sapcyti_dev_secret_key}
    volumes:
      - sapcyti-dev-storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || curl -sf http://localhost:9000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  storage-init:
    image: minio/mc:latest
    container_name: sapcyti-dev-storage-init
    restart: "no"
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set rustfs http://storage:9000 $${STORAGE_ACCESS_KEY:-sapcyti_dev_access} $${STORAGE_SECRET_KEY:-sapcyti_dev_secret_key} --api s3v4;
      /usr/bin/mc mb --ignore-existing rustfs/sapcyti-documents;
      exit 0;
      "

volumes:
  sapcyti-dev-storage-data:
    name: sapcyti-dev-storage-data
