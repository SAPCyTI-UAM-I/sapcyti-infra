resolver 127.0.0.11 valid=10s ipv6=off;

# ── IP real del cliente (rangos oficiales de Cloudflare: https://www.cloudflare.com/ips/) ──
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ── Rate limiting (calculado sobre la IP real del cliente) ──
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_strict_limit:10m rate=5r/m;
limit_req_status 429;

# ── HTTP → HTTPS (Redirección global 301) ──
server {
    listen 80;
    server_name sapcyti.site www.sapcyti.site qa.sapcyti.site dev.sapcyti.site;
    return 301 https://$host$request_uri;
}

# ── Dev (Entorno de desarrollo / sandbox) ──
server {
    listen 443 ssl;
    server_name dev.sapcyti.site;

    ssl_certificate     /etc/nginx/certs/sapcyti.site.crt;
    ssl_certificate_key /etc/nginx/certs/sapcyti.site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Origin lock (AOP): activar tras habilitar en Cloudflare
    ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        set $edge http://sapcyti-dev-edge:80;
        proxy_pass $edge;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ── QA (Sin límite estricto de autenticación para no bloquear pruebas e2e) ──
server {
    listen 443 ssl;
    server_name qa.sapcyti.site;

    ssl_certificate     /etc/nginx/certs/sapcyti.site.crt;
    ssl_certificate_key /etc/nginx/certs/sapcyti.site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Origin lock (AOP): activar tras habilitar en Cloudflare
    ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /api/ {
        limit_req zone=api_general_limit burst=20 nodelay;
        set $edge http://sapcyti-qa-edge:80;
        proxy_pass $edge;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        set $edge http://sapcyti-qa-edge:80;
        proxy_pass $edge;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ── Prod (Producción con rate limit estricto en login y cabeceras completas) ──
server {
    listen 443 ssl;
    server_name sapcyti.site www.sapcyti.site;

    ssl_certificate     /etc/nginx/certs/sapcyti.site.crt;
    ssl_certificate_key /etc/nginx/certs/sapcyti.site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Origin lock (AOP): activar tras habilitar en Cloudflare
    ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location ~ ^/api/auth/(login|forgot-password|reset-password)$ {
        limit_req zone=auth_strict_limit burst=3 nodelay;
        set $edge http://sapcyti-prod-edge:80;
        proxy_pass $edge;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        limit_req zone=api_general_limit burst=20 nodelay;
        set $edge http://sapcyti-prod-edge:80;
        proxy_pass $edge;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        set $edge http://sapcyti-prod-edge:80;
        proxy_pass $edge;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
