resolver 127.0.0.11 valid=10s ipv6=off;

# Redirección HTTP a HTTPS
server {
    listen 80;
    server_name sapcyti.site www.sapcyti.site qa.sapcyti.site dev.sapcyti.site;
    return 301 https://$host$request_uri;
}

# Dev
server {
    listen 443 ssl;
    server_name dev.sapcyti.site;

    ssl_certificate /etc/nginx/certs/sapcyti.site.crt;
    ssl_certificate_key /etc/nginx/certs/sapcyti.site.key;

    location / {
        set $edge http://sapcyti-dev-edge:80;
        proxy_pass $edge;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

